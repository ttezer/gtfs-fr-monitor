[project]
name = "gtfs-fr-monitor"
version = "0.0.0"
description = "Monitoring pipeline for GTFS feeds published on transport.data.gouv.fr"
requires-python = ">=3.11"
license = {text = "MIT"}
# The shared engine and pipeline, pinned to a commit of gtfs-jp-monitor. Locally the sibling
# checkout is used instead (PYTHONPATH=src:../GTFS-JP/src).
dependencies = ["gtfs-jp-monitor @ git+https://github.com/ttezer/gtfs-jp-monitor@08c0640"]

[project.optional-dependencies]
dev = ["jsonschema>=4.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtfs_fr_monitor = ["data/*.json"]
