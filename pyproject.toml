[project]
name = "gtfs-fr-monitor"
version = "0.0.0"
description = "Monitoring pipeline for GTFS feeds published on transport.data.gouv.fr"
requires-python = ">=3.11"
license = {text = "MIT"}
# The engine and pipeline (gtfs_fr_semantic, gtfs_fr_pipeline) live in this repository: copied from
# gtfs-jp-monitor at 0d4d7f2 and developed here on their own (notes/DESIGN.md). No dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtfs_fr_monitor = ["data/*.json"]
gtfs_fr_semantic = ["default_config.json", "data/*.json"]
gtfs_fr_pipeline = ["classification.json"]
